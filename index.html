<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outing Planner</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <div class="app-header">
      <div class="app-title">Outing Planner</div>
    </div>

    <div class="top-grid">
      <!-- Search + time controls -->
      <div class="card">
        <div class="input-row">
          <div class="search-wrapper">
            <input type="text" id="city" placeholder="Enter city (e.g. New York, Tokyo)" onkeydown="handleCityKeydown(event)" autocomplete="off" />
            <div class="autocomplete-dropdown" id="autocompleteDropdown" style="display:none;"></div>
          </div>
          <button onclick="searchCity()">Search</button>
        </div>

        <div class="time-controls" id="timeControls" style="display:none;">
          <div class="time-section-label">When are you going out?</div>
          <div class="time-row">
            <label>Start</label>
            <input type="range" id="startHour" min="0" max="47" value="0" />
            <div class="time-display" id="startDisplay">Now</div>
          </div>
          <div class="time-row">
            <label>End</label>
            <input type="range" id="endHour" min="1" max="48" value="3" />
            <div class="time-display" id="endDisplay">+3h</div>
          </div>
        </div>
      </div>

      <!-- Overview panel — filled by JS -->
      <div class="card" id="overviewPanel">
        <div class="overview-placeholder">Search a city to view conditions</div>
      </div>
    </div>

    <div id="loading" style="display:none;">Loading weather data...</div>
    <div id="results"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
